<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRAINROT QUIZ 💀</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #ff2d78;
      --yellow: #ffe600;
      --cyan: #00f0ff;
      --purple: #9b5de5;
      --bg: #0a0a0f;
      --card: #14141f;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* floating particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .particle {
      position: absolute;
      font-size: 1.5rem;
      animation: floatUp linear infinite;
      opacity: 0.15;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    #app {
      position: relative;
      z-index: 1;
      width: min(600px, 95vw);
      text-align: center;
    }

    /* ---- SCREENS ---- */
    .screen { display: none; flex-direction: column; align-items: center; gap: 1.5rem; }
    .screen.active { display: flex; }

    /* START */
    .title {
      font-family: 'Bangers', cursive;
      font-size: clamp(3rem, 12vw, 6rem);
      letter-spacing: 4px;
      background: linear-gradient(135deg, var(--pink), var(--yellow), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 8px var(--pink)); }
      50%       { filter: drop-shadow(0 0 24px var(--cyan)); }
    }

    .subtitle {
      font-size: 1.1rem;
      color: #aaa;
      max-width: 420px;
    }

    .btn {
      padding: .85rem 2.5rem;
      border: none;
      border-radius: 9999px;
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: scale(1.07); }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      box-shadow: 0 0 24px var(--pink);
    }
    .btn-secondary {
      background: transparent;
      color: var(--cyan);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    /* GAME */
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: .9rem;
      color: #aaa;
    }
    .hud span { font-weight: 700; color: #fff; }

    .timer-bar-wrap {
      width: 100%;
      height: 8px;
      background: #222;
      border-radius: 9999px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      border-radius: 9999px;
      transition: width .1s linear, background .5s;
    }

    .question-card {
      background: var(--card);
      border: 1px solid #222;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      width: 100%;
      box-shadow: 0 0 40px rgba(155, 93, 229, .2);
    }

    .word {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.5rem, 10vw, 4rem);
      letter-spacing: 3px;
      color: var(--yellow);
      margin-bottom: .5rem;
      text-shadow: 0 0 20px rgba(255,230,0,.4);
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
      margin-top: 1.5rem;
    }

    .choice {
      padding: 1rem .75rem;
      border-radius: 14px;
      background: #1e1e2e;
      border: 2px solid #2e2e4e;
      color: #ddd;
      font-size: .95rem;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      text-align: left;
      line-height: 1.3;
    }
    .choice:hover { border-color: var(--cyan); background: #1a2030; transform: translateY(-2px); }
    .choice.correct { border-color: #00e676; background: rgba(0,230,118,.12); color: #00e676; }
    .choice.wrong   { border-color: var(--pink); background: rgba(255,45,120,.12); color: var(--pink); }
    .choice.disabled { pointer-events: none; }

    /* feedback pop */
    .feedback {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      letter-spacing: 2px;
      min-height: 2.5rem;
      transition: opacity .3s;
    }
    .feedback.correct { color: #00e676; }
    .feedback.wrong   { color: var(--pink); }

    /* RESULT */
    .result-score {
      font-family: 'Bangers', cursive;
      font-size: clamp(4rem, 16vw, 8rem);
      background: linear-gradient(135deg, var(--yellow), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .result-label {
      font-size: 1.3rem;
      color: #aaa;
    }
    .verdict {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--cyan);
    }
    .result-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    /* streak badge */
    .streak {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(255,230,0,.1);
      border: 1px solid var(--yellow);
      border-radius: 9999px;
      padding: .3rem .9rem;
      font-size: .85rem;
      color: var(--yellow);
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div id="app">

  <!-- START SCREEN -->
  <section class="screen active" id="screen-start">
    <div class="title">BRAINROT<br>QUIZ 💀</div>
    <p class="subtitle">How deep is your brainrot? Match the slang to its meaning before time runs out.</p>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-primary" onclick="startGame('easy')">EASY (15s)</button>
      <button class="btn btn-primary" style="background:linear-gradient(135deg,#ff9500,var(--pink))" onclick="startGame('medium')">MEDIUM (10s)</button>
      <button class="btn btn-primary" style="background:linear-gradient(135deg,var(--pink),#ff0000);box-shadow:0 0 24px #f00" onclick="startGame('hard')">HARD (6s)</button>
    </div>
    <p style="color:#555;font-size:.8rem">10 questions per round</p>
  </section>

  <!-- GAME SCREEN -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div>Question <span id="q-num">1</span>/10</div>
      <div class="streak" id="streak-badge">🔥 Streak: <span id="streak-count">0</span></div>
      <div>Score <span id="score-display">0</span></div>
    </div>
    <div class="timer-bar-wrap"><div class="timer-bar" id="timer-bar"></div></div>
    <div class="question-card">
      <div class="word" id="q-word">SKIBIDI</div>
      <p style="color:#666;font-size:.85rem">What does this mean?</p>
      <div class="choices" id="choices"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- RESULT SCREEN -->
  <section class="screen" id="screen-result">
    <div class="result-score" id="final-score">0</div>
    <div class="result-label">out of 10 correct</div>
    <div class="verdict" id="verdict"></div>
    <div class="result-actions">
      <button class="btn btn-primary" onclick="restartGame()">PLAY AGAIN</button>
      <button class="btn btn-secondary" onclick="showStart()">CHANGE MODE</button>
    </div>
  </section>

</div>

<script>
const WORDS = [
  { word: "SKIBIDI", correct: "Nonsense/cool (from Skibidi Toilet YouTube series)", wrong: ["Very smart", "A type of food", "Extremely tired"] },
  { word: "RIZZ", correct: "Natural charm or ability to attract others", wrong: ["To mess something up", "A loud noise", "Free stuff"] },
  { word: "GYATT", correct: "Exclamation when seeing someone attractive/curvy", wrong: ["Getting lost", "Being angry", "A type of dance"] },
  { word: "FANUM TAX", correct: "Stealing food from a friend's plate", wrong: ["A government fee", "Paying for a subscription", "Losing a bet"] },
  { word: "SIGMA", correct: "A lone, self-reliant, cool individual", wrong: ["A math symbol only", "A loud person", "Someone who fails"] },
  { word: "DELULU", correct: "Delusional — believing something unrealistic", wrong: ["Very sleepy", "Extremely happy", "A small dog breed"] },
  { word: "NPC", correct: "Someone acting like a background character with no personality", wrong: ["A type of gamer", "A new PC brand", "Someone very rich"] },
  { word: "NO CAP", correct: "No lie, for real, seriously", wrong: ["Without a hat", "Zero money left", "Not caring"] },
  { word: "BUSSIN", correct: "Really good, especially food", wrong: ["Fighting someone", "Being late", "Driving fast"] },
  { word: "MID", correct: "Mediocre, average, underwhelming", wrong: ["The middle of something", "Midnight", "Feeling sick"] },
  { word: "BASED", correct: "Confident, not caring what others think", wrong: ["Boring and plain", "Having a low voice", "Located somewhere"] },
  { word: "W", correct: "A win or something excellent", wrong: ["A letter only", "Wrong answer", "Weak"] },
  { word: "L", correct: "A loss or failure", wrong: ["Left turn", "Long", "Loud"] },
  { word: "RATIO", correct: "When a reply gets more likes than the original post (embarrassing)", wrong: ["A math fraction", "A good comeback", "Going viral"] },
  { word: "TOUCH GRASS", correct: "Go outside, stop being online so much", wrong: ["A gardening tip", "A relaxing hobby", "A new TikTok trend"] },
  { word: "SLAY", correct: "To do something impressively or look amazing", wrong: ["To defeat an enemy", "To sleep in", "To waste time"] },
  { word: "LOWKEY", correct: "Secretly or quietly, kind of", wrong: ["Very loud", "A music key", "Obvious to everyone"] },
  { word: "DRIP", correct: "Stylish outfit or accessories", wrong: ["A leaky faucet", "Being sad", "Moving slowly"] },
  { word: "SIMP", correct: "Someone who does too much for a crush or celebrity", wrong: ["A simple person", "A type of music", "Being shy"] },
  { word: "MAIN CHARACTER", correct: "Acting like your life is the center of the story / being dramatic", wrong: ["The star of a movie", "A gamer term only", "Being boring"] },
  { word: "OHIO", correct: "A place associated with cursed, weird, or chaotic content", wrong: ["Just the US state", "A slang for okay", "Something old-fashioned"] },
  { word: "SHEESH", correct: "Expression of amazement or hype", wrong: ["Being annoyed", "Feeling cold", "A type of food"] },
  { word: "GOAT", correct: "Greatest Of All Time", wrong: ["A farm animal only", "Someone who quits", "A weird person"] },
  { word: "ATE", correct: "Did something perfectly, nailed it", wrong: ["Past tense of eating only", "Being hungry", "A number eight"] },
  { word: "SIDE QUEST", correct: "An unexpected detour or task in real life", wrong: ["A video game mission only", "A short trip", "A failed plan"] },
];

let currentDifficulty = 'medium';
let timeLimit = 10;
let questions = [];
let currentQ = 0;
let score = 0;
let streak = 0;
let timerInterval = null;
let timeLeft = 0;
let answered = false;

const timeLimits = { easy: 15, medium: 10, hard: 6 };

function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

function buildQuestions() {
  const pool = shuffle(WORDS).slice(0, 10);
  return pool.map(item => {
    const wrongOptions = shuffle(item.wrong).slice(0, 3);
    const choices = shuffle([item.correct, ...wrongOptions]);
    return { word: item.word, correct: item.correct, choices };
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(difficulty) {
  currentDifficulty = difficulty;
  timeLimit = timeLimits[difficulty];
  questions = buildQuestions();
  currentQ = 0;
  score = 0;
  streak = 0;
  showScreen('screen-game');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[currentQ];
  document.getElementById('q-num').textContent = currentQ + 1;
  document.getElementById('score-display').textContent = score;
  document.getElementById('streak-count').textContent = streak;
  document.getElementById('q-word').textContent = q.word;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c;
    btn.onclick = () => selectAnswer(c, q.correct);
    choicesEl.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = timeLimit;
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  bar.style.background = 'linear-gradient(90deg, #00f0ff, #9b5de5)';

  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    const pct = (timeLeft / timeLimit) * 100;
    bar.style.width = pct + '%';
    if (pct < 40) bar.style.background = 'linear-gradient(90deg, #ffe600, #ff2d78)';
    if (pct < 15) bar.style.background = '#ff2d78';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timeOut();
    }
  }, 100);
}

function timeOut() {
  if (answered) return;
  answered = true;
  streak = 0;
  document.getElementById('streak-count').textContent = streak;
  showFeedback('⏰ TOO SLOW!', 'wrong');
  revealCorrect();
  setTimeout(nextQuestion, 1400);
}

function selectAnswer(choice, correct) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const buttons = document.querySelectorAll('.choice');
  buttons.forEach(b => b.classList.add('disabled'));

  if (choice === correct) {
    score++;
    streak++;
    const bonus = streak >= 3 ? ' 🔥' : '';
    showFeedback(['W 💯', 'BASED!', 'NO CAP!', 'SLAY!', 'GOAT!'][Math.floor(Math.random()*5)] + bonus, 'correct');
    buttons.forEach(b => { if (b.textContent === correct) b.classList.add('correct'); });
  } else {
    streak = 0;
    showFeedback(['L 💀', 'MID ANSWER', 'RATIO\'D', 'CRINGE'][Math.floor(Math.random()*4)], 'wrong');
    buttons.forEach(b => {
      if (b.textContent === choice) b.classList.add('wrong');
      if (b.textContent === correct) b.classList.add('correct');
    });
  }

  document.getElementById('score-display').textContent = score;
  document.getElementById('streak-count').textContent = streak;
  setTimeout(nextQuestion, 1400);
}

function revealCorrect() {
  const q = questions[currentQ];
  document.querySelectorAll('.choice').forEach(b => {
    b.classList.add('disabled');
    if (b.textContent === q.correct) b.classList.add('correct');
  });
}

function showFeedback(text, type) {
  const el = document.getElementById('feedback');
  el.textContent = text;
  el.className = 'feedback ' + type;
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= 10) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('final-score').textContent = score;
  const verdicts = [
    [0, 2, "MASSIVE L 💀 Touch grass immediately"],
    [3, 4, "MID at brainrot 😐"],
    [5, 6, "LOWKEY based 👀"],
    [7, 8, "HIGH RIZZ ENERGY ⚡"],
    [9, 9, "GOAT BEHAVIOR 🐐"],
    [10, 10, "FULL SIGMA BRAINROT 💀🔥"],
  ];
  const v = verdicts.find(([min, max]) => score >= min && score <= max);
  document.getElementById('verdict').textContent = v ? v[2] : '';
  showScreen('screen-result');
}

function restartGame() { startGame(currentDifficulty); }
function showStart() { showScreen('screen-start'); }

// particles
const EMOJIS = ['💀','🔥','⚡','💯','🐐','👑','🫡','😤','💅','🗿','🤑','🫶'];
const container = document.getElementById('particles');
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDuration = (8 + Math.random() * 12) + 's';
  p.style.animationDelay = (-Math.random() * 20) + 's';
  p.style.fontSize = (.8 + Math.random() * 1.5) + 'rem';
  container.appendChild(p);
}
</script>
</body>
</html>
